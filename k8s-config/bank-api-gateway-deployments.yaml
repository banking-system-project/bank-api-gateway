apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-api-gateway-service
  labels:
    name: bank-api-gateway-service
    app: banking-system
spec:
  replicas: 1
  selector:
    matchLabels:
      name: bank-api-gateway-service
      app: banking-system
  template:
    metadata:
      labels:
        name: bank-api-gateway-service
        app: banking-system
    spec:
      containers:
        - name: bank-api-gateway-service
          image: prithwi8972/bank-api-gateway:1.1.1
          resources:
            limits:
              memory: "900Mi"
              cpu: 400m
            requests:
              memory: "700Mi"
              cpu: 300m
          ports:
            - containerPort: 8070
          env:
            - name: EUREKA_SERVER_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: eureka-cm
                  key: eureka_service_address

---

apiVersion: v1
kind: Service
metadata:
  name: bank-apigateway-lb
spec:
  type: LoadBalancer
  selector:
    app: banking-system
    name: bank-api-gateway-service
  ports:
    - port: 8070
      targetPort: 8070
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: eureka-cm
data:
  eureka_service_address: "http://service-registry-deploy-0.service-registry-deploy.default.svc.cluster.local:8085/eureka"
